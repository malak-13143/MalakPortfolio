<section class="section">
  <div class="wrap">
    @if(language.currentLanguage() === 'en') {
      <p class="kicker">
        404
      </p>
      <h1 class="h">
        Page not found
      </h1>
      <p>
        Sorry, the page you're looking for doesn't exist.
      </p>
      <a routerLink="/home" class="btn primary">
        Back to home
      </a>
    } @else {
      <p class="kicker">
        404
      </p>
      <h1 class="h">
        الصفحة غير موجودة
      </h1>
      <p>
        معلش، الصفحة اللي بتدور عليها مش موجودة.
      </p>
      <a routerLink="/home" class="btn primary">
        العودة للرئيسية
      </a>
    }

  </div>
</section>
