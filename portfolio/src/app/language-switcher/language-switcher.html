<div class="lang-switch" role="group" aria-label="Language switch">
  <button (click)="language.currentLanguage.set('en')" class="lang-btn lang-btn-en">EN</button>
  <button (click)="language.currentLanguage.set('ar')" class="lang-btn lang-btn-ar">ع</button>
</div>
